name: fieldtask_pro
description: FieldTask Pro - app offline-first de gestion d'interventions
publish_to: none
version: 1.0.0
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5
  http: ^1.2.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true